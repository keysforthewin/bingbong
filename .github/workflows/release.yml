name: Release

# Push a tag like v1.2.3 and this builds the Windows client as a single
# self-contained bingbong.exe and attaches it to a GitHub Release.
# The app's auto-updater looks for exactly that asset name.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish single-file exe
        shell: bash
        run: |
          dotnet publish client/bingbong.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$VERSION" \
            -o publish
          ls -la publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/bingbong.exe
          generate_release_notes: true
